[project]
name = "ripple-replay"
version = "0.1.0"
description = "Auditable offline portfolio replay research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "exchange-calendars>=4.8,<5",
    "yfinance>=0.2.65,<2",
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.5,<2",
    "arch>=7.0,<9",
]

[project.scripts]
ripple = "ripple.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ripple"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
